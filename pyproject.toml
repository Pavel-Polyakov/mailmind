[project]
name = "mailmind"
version = "0.1.0"
description = "Scan Gmail, classify with an LLM, keep the results in SQLite."
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
dependencies = [
    "typer>=0.15",
    "rich>=13.9",
    "pydantic>=2.10",
    "google-api-python-client>=2.156",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
openai = ["openai>=1.59"]
anthropic = ["anthropic>=0.42"]

[project.scripts]
mailmind = "mailmind.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "openai>=1.59",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
